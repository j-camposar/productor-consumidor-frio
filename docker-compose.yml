
version: '3.8'
services:
  
  consumidor:
    build:
      context: ./consumidor
    container_name: consumidor
    ports:
    - "8081:8080"
 
    environment:
    # Esto le dice a Spring Boot que se conecte usando el nombre del servicio en la red interna de Docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
  productor:
    build:
      context: ./productor
    container_name: productor
    ports:
    - "8082:8080"
   
    environment:
    # Esto le dice a Spring Boot que se conecte usando el nombre del servicio en la red interna de Docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}

